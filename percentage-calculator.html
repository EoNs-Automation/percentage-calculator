<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator | EoNs Automation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #bbb;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button:hover {
            background: #0d47a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #1e1e1e;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            font-size: 20px;
            min-height: 30px;
        }
        .inputs {
            display: none;
        }
        .inputs.active {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Percentage Calculator</h1>
    <p class="subtitle">EoNs Automation</p>

    <label for="mode">Calculation Type</label>
    <select id="mode" onchange="updateInputs()">
        <option value="percentOf">What is X% of Y?</option>
        <option value="isWhatPercent">X is what percent of Y?</option>
        <option value="change">Percentage increase / decrease</option>
    </select>

    <!-- Mode 1: What is X% of Y? -->
    <div id="percentOf" class="inputs active">
        <label for="percent1">Percentage (X)</label>
        <input type="number" id="percent1" placeholder="e.g. 20" step="any">
        <label for="total1">Total Value (Y)</label>
        <input type="number" id="total1" placeholder="e.g. 150" step="any">
    </div>

    <!-- Mode 2: X is what percent of Y? -->
    <div id="isWhatPercent" class="inputs">
        <label for="part2">Part Value (X)</label>
        <input type="number" id="part2" placeholder="e.g. 30" step="any">
        <label for="total2">Total Value (Y)</label>
        <input type="number" id="total2" placeholder="e.g. 150" step="any">
    </div>

    <!-- Mode 3: Percentage change -->
    <div id="change" class="inputs">
        <label for="oldValue">Original Value</label>
        <input type="number" id="oldValue" placeholder="e.g. 100" step="any">
        <label for="newValue">New Value</label>
        <input type="number" id="newValue" placeholder="e.g. 120" step="any">
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="result-box" id="result">Result will appear here</div>

    <script>
        function updateInputs() {
            const mode = document.getElementById("mode").value;
            document.querySelectorAll(".inputs").forEach(el => el.classList.remove("active"));
            document.getElementById(mode).classList.add("active");
            document.getElementById("result").textContent = "Result will appear here";
        }

        function calculate() {
            const mode = document.getElementById("mode").value;
            const resultBox = document.getElementById("result");

            try {
                if (mode === "percentOf") {
                    const percent = parseFloat(document.getElementById("percent1").value);
                    const total = parseFloat(document.getElementById("total1").value);
                    if (isNaN(percent) || isNaN(total)) throw new Error();
                    const result = (percent / 100) * total;
                    resultBox.textContent = `${percent}% of ${total} = ${result.toFixed(2)}`;

                } else if (mode === "isWhatPercent") {
                    const part = parseFloat(document.getElementById("part2").value);
                    const total = parseFloat(document.getElementById("total2").value);
                    if (isNaN(part) || isNaN(total) || total === 0) throw new Error();
                    const result = (part / total) * 100;
                    resultBox.textContent = `${part} is ${result.toFixed(2)}% of ${total}`;

                } else if (mode === "change") {
                    const oldVal = parseFloat(document.getElementById("oldValue").value);
                    const newVal = parseFloat(document.getElementById("newValue").value);
                    if (isNaN(oldVal) || isNaN(newVal) || oldVal === 0) throw new Error();
                    const result = ((newVal - oldVal) / oldVal) * 100;
                    const type = result >= 0 ? "increase" : "decrease";
                    resultBox.textContent = `Percentage ${type}: ${Math.abs(result).toFixed(2)}%`;
                }
            } catch {
                resultBox.textContent = "Please enter valid numbers.";
            }
        }
    </script>

</body>
</html>
